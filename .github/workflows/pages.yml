# Publishes docs/ + nanoqalgos.py to GitHub Pages: the browser demo runs the exact
# same file you read in the repo. Enable once: Settings → Pages → Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp docs/* _site/ && cp nanoqalgos.py nanoqalgos_math.py _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
