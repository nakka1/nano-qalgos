name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one broken version should not cancel the others
      matrix:
        python: ["3.10", "3.12", "3.14"]  # oldest supported, common, newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: pytest -q
      - run: nanoqalgos demo && nanoqalgos bench && nanoqalgos verify
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nano-qalgos . && docker run --rm nano-qalgos bench 
